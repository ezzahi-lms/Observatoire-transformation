agent:
  name: Observatoire Transformation
  version: 1.1.0
  default_sector: pharma_maroc
collection:
  days_back: 35
  max_search_results: 15
  max_articles_total: 60
  # ── Source PDFs Magazines ─────────────────────────────────────────────────
  # PDFs de presse téléchargés depuis WhatsApp (groupe Biblio Observ Transfo).
  # Laisser vide "" pour désactiver. Peut aussi être défini via $MAGAZINES_DIR.
  magazines_dir: "C:/Users/LMS/OneDrive - LMS ORH/Bureau/LMS-Orga/Observatoire Transformation/Magazines"
  pdf_days_back: 365        # Fenêtre de sélection (jours) — large = + de candidats, SANS surcoût tokens
  pdf_max_chars: 3000       # Caractères extraits par PDF
  pdf_min_score: 1          # Score pertinence minimum (nb mots-clés matchés)
  pdf_max_docs: 25          # Nb de PDFs RÉELLEMENT injectés par run — ⚠️ principal levier de coût tokens
analysis:
  provider: gemini                  # anthropic | gemini | groq (Anthropic = qualité max, requiert du crédit API)
  model: claude-opus-4-8            # Modèle Anthropic utilisé si provider=anthropic (prêt si recrédit)
  gemini_model: gemini-2.5-pro      # Modèle Gemini (si provider=gemini) — Pro = nettement > Flash, quota gratuit AI Studio
  gemini_max_tokens: 4096           # Limite sortie Gemini (free tier plus restrictif)
  gemini_max_articles: 12           # Nb articles max envoyés à Gemini (prompt plus court)
  gemini_summary_len: 150           # Longueur résumé article pour Gemini (vs 400 Anthropic)
  groq_model: llama-3.3-70b-versatile  # Modèle Groq (si provider=groq — free tier généreux)
  groq_max_tokens: 7000             # Groq free tier : limite 12k TPM ; avec ~2500 input → 7000 output safe
  groq_max_articles: 10             # Nb articles max envoyés à Groq (limiter tokens input)
  groq_summary_len: 200             # Longueur résumé article pour Groq
  max_tokens: 8192
  temperature: 0.3
qa:
  # Contrôle qualité automatique (agent/qa_gate.py) — 100 % code, aucun coût token.
  min_score: 80            # Score /100 minimum pour qu'un benchmark soit "publiable" ; en dessous → quarantaine
reporting:
  formats:
  - docx
  - html
  output_dir: reports
  filename_pattern: veille_{sector}_{date}
scheduling:
  enabled: true
  frequency: monthly
  day_of_month: 1
  hour: 8
  minute: 0
  # Planification spécifique aux Rapports Innovation (Solution 3)
  # Tourne le 1er du mois à 07h00 — avant la veille sectorielle (08h00)
  innovation:
    day_of_month: 1
    hour: 7
    minute: 0
logging:
  level: INFO
  file: reports/agent.log
