    context_note: >
      Le secteur bancaire marocain est dominé par 5 groupes : Attijariwafa Bank, Banque Populaire,
      BMCE Bank of Africa, CIH Bank, Société Générale Maroc. Ces groupes ont une forte empreinte
      africaine (20-40 pays pour les leaders) qui génère des enjeux organisationnels spécifiques :
      gouvernance multi-entités, harmonisation des SI, management interculturel, conformité multi-pays.
      Régulateur : Bank Al-Maghrib (BAM). Pression réglementaire croissante : Bâle III/IV, lutte
      anti-blanchiment, souveraineté des données. Transformation digitale accélérée post-Covid :
      mobile banking, open banking, fintechs concurrentes. Enjeux RH : guerre des talents numériques,
      reconversion des réseaux agences, nouvelles compétences data/cyber/compliance.
      Questions-clés clients LMS ORH : comment gouverner un groupe bancaire panafricain ?
      Quel modèle de centre de services partagés pour les fonctions support ? Comment dimensionner
      les équipes risques/compliance dans un contexte réglementaire croissant ?
      FOCUS : transformations organisationnelles uniquement (structures, RH, gouvernance, SI).

