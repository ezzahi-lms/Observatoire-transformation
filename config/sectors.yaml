      # Ouverture africaine / MENA
      - "pharmaceutical industry Africa transformation organisationnelle hub Morocco"
      - "industrie pharmaceutique Afrique subsaharienne transformation organisation 2025"
      - "pharmaceutical Morocco Africa MENA benchmark organisationnel"
      # Réglementation comme levier d'organisation
      - "conformité réglementaire AMIP DMP transformation organisation pharma Maroc"
      - "pharmaceutical regulation Morocco organizational compliance transformation"
      # Dimensionnement & externalisation
      - "dimensionnement effectifs pharma Maroc externalisation sous-traitance"
      - "make or buy pharmaceutical Morocco outsourcing organizational"

    rss_feeds:
      - url: "https://www.pharmaceutical-technology.com/feed/"
        name: "Pharmaceutical Technology"
      - url: "https://www.fiercepharma.com/rss/xml"
        name: "FiercePharma"
