        name: "OMS — Actualités Afrique/Monde"
      - url: "https://www.biopharmadive.com/feeds/news/"
        name: "BioPharma Dive"

    context_note: >
      Le Maroc est le 2e producteur pharmaceutique d'Afrique (~600 entreprises, ~40 000 emplois directs).
      Acteurs locaux majeurs : Sothema, Cooper Pharma, Laprophan, Pharma 5, Maphar, Galenica, Bottu.
      Multinationales présentes : Sanofi, Roche, Pfizer, AstraZeneca (bureaux locaux + parfois production).
      Régulateur : AMIP (ex-DMP). Plan de Santé 2025. Ambition nationale : couvrir 70 % des besoins
      nationaux, devenir hub export africain via la ZLECAf, monter en gamme vers biosimilaires/biotech
      (projet Marbio, horizon 2030). Contexte africain : marché continental estimé à 50 Md$, retraits
      progressifs de multinationales qui laissent un espace organisationnel aux industriels marocains.
      Questions-clés des clients LMS ORH : comment dimensionner les équipes pour l'export Afrique ?
      Quelle gouvernance pour les filiales africaines ? Quelles fonctions internaliser vs externaliser ?
      Quel SI pour piloter une organisation multi-pays ? Quelles compétences pour accompagner le
      repositionnement biosimilaire/biotech ?
      FOCUS BENCHMARK : Analyser UNIQUEMENT les TRANSFORMATIONS ORGANISATIONNELLES
      (structures, modèles opérationnels, RH, culture, gouvernance, digitalisation des organisations).
      PAS les pipelines R&D, résultats cliniques, actualités boursières pures.

    benchmark_axes:
      # ── FCS — tous niveaux (méthode 4P : périmètre organisationnel strict)
      - "FCS Stratégique : vision hub africain, repositionnement chaîne de valeur (générique→biosimilaire/biotech), stratégie ZLECAf, alliances panafricaines"
      - "FCS Organisationnel : agilité structurelle pour croissance export, intégration de partenariats, gouvernance filiales Afrique subsaharienne"
      - "FCS Opérationnel : excellence BPF/GMP, efficience supply chain multi-pays, traçabilité et qualité à l'export africain"
      - "FCS Technologique : maturité ERP/MES/QMS, adoption IA dans les processus, SI adapté au multi-pays, cybersécurité"
      - "FCS Humain & RH : attraction/rétention talents qualifiés (pharmaciens, data scientists, managers africains), leadership interculturel, compétences bilingues FR/EN/AR"
      # ── Questions structurantes clients LMS ORH
      - "Dimensionnement : tendances effectifs (croissance vs optimisation), ratio encadrement, évolution des fonctions support (RH, Digital, Finance, Qualité), pyramide des âges"
      - "Gouvernance : structures de direction (familiaux vs institutionnels), gouvernance filiales/JV africaines, rôle des Conseils d'Administration, conformité AMIP, reporting ESG, pilotage de la performance multi-entités"
      - "Externalisation & Partenariats : make-or-buy fonctions support (IT, logistique, formation, comptabilité), sous-traitance industrielle, accords de licence, modèles d'alliance africains"
      - "Systèmes d'Information : SI intégré pour pilotage multi-sites/multi-pays, digitalisation des processus RH (SIRH), traçabilité réglementaire, tableau de bord performance"
      # ── Gestion de la performance
      - "Gestion de la performance : KPIs sectoriels (qualité, conformité, export), systèmes d'évaluation et d'incentive adaptés au contexte africain, management par objectifs"
      # ── Ouverture Afrique/MENA
      - "Dimension Afrique & MENA : benchmarks organisationnels régionaux, best practices hubs pharma africains (Afrique du Sud, Égypte, Éthiopie), opportunités ZLECAf, risques pays"
      # ── RSE & Éthique
      - "RSE & Éthique : accès aux médicaments essentiels en Afrique, impact environnemental production, diversité & inclusion (parité, recrutement local Afrique), reporting RSE/ESG, éthique essais cliniques"
      # ── Signaux réglementaires à enjeu organisationnel
      - "Réglementation comme levier d'organisation : AMIP/DMP nouvelles exigences, normes EMA/WHO-GMP applicables à l'export, délais de mise en conformité organisationnelle"

