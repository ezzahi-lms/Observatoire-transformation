      - "Externalisation & Partenariats : outsourcing IT, centres de services partagés, co-développement fintechs, externalisation back-office"
      - "Systèmes d'Information : modernisation core banking, SI groupe harmonisé Afrique, SIRH groupe, tableaux de bord consolidés, souveraineté données"
