      Secteur structuré autour du Plan Maroc Vert (Green Generation 2020-2030) et de l'ambition
      d'export vers l'Afrique. Enjeux organisationnels : modernisation des structures familiales,
      intégration verticale vs externalisation, gestion des filières agricoles, transformation
      numérique de la supply chain, gouvernance des coopératives. Fort enjeu RSE/durabilité
      (eau, empreinte carbone, conditions travail agricole).
      Questions clients LMS ORH : comment structurer la direction générale d'un groupe agroalimentaire
      en croissance ? Quel modèle de gouvernance pour les coopératives et filiales africaines ?
