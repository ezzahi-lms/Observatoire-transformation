# ──────────────────────────────────────────────────────────────────────────────
#  Secteurs — Observatoire de la Transformation Organisationnelle — LMS ORH
#
#  Structure par secteur :
#    label           : Nom affiché dans les rapports
#    language        : fr | en | ar
#    search_queries  : Requêtes DuckDuckGo (collecte web)
#    rss_feeds       : Flux RSS (collecte presse)
#    benchmark_axes  : Axes prioritaires transmis à Claude (méthode 4P)
#    context_note    : Contexte sectoriel + périmètre + focus missions conseil
#
#  Méthode 4P : chaque analyse produit Persona / Process / Périmètre / Produit
#  3 lectures "So what?" : Secteur → Clients → Cabinet (LMS ORH)
#  Dimension Afrique/MENA : systématiquement intégrée
