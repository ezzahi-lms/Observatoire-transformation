      Le Maroc ambitionne de devenir hub tech africain via la stratégie Maroc Digital 2030 et le
      développement des offshoring IT (CasaShore, TechnoPark). Enjeux organisationnels majeurs :
      transformation des opérateurs vers les services cloud/cybersécurité/IoT, gouvernance des filiales
      africaines, reconversion des effectifs liés au réseau physique, attraction des talents tech.
      ANRT = régulateur. Fort enjeu de dimensionnement : réduction réseau traditionnel vs croissance
      équipes data/digital.
      Questions clients LMS ORH : comment réorganiser un opérateur en transition digital ?
      Quel modèle de gouvernance pour les filiales Afrique ? Comment externaliser l'infrastructure ?
